services:
  - type: web
    runtime: docker
    name: gestor-identidades-demo
    region: oregon
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_ENCRYPTION_KEY
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: ALLOW_DEMO_ADMIN_BYPASS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-identidades-db
          property: connectionString

databases:
  - name: gestor-identidades-db
    region: oregon
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: gestor_identidades
    user: gestor_identidades
